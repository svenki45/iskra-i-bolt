<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Искра и Болт</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Rubik:wght@400;500;700&family=Russo+One&display=swap">
<style>
/* Layout: one-screen game. Thin title bar + level hint, blueprint-sheet stage centered, key legend for both players below. Single dark "night workshop" look by choice. */
:root{
  --night:#0b1830; --paper:#0f2547; --line:#9cc3ff; --ink:#e8effa; --muted:#93a9cb; --panel:#132c52;
  --spark:#ff8a3d; --bolt:#62c7c1; --brass:#e7b54a; --danger:#ff6b6b;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:12px;box-sizing:border-box;max-width:1400px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.brand{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.02em;margin:0}
.brand .s{color:var(--spark)} .brand .b{color:var(--bolt)}
.lvl{font-family:var(--display);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stats{margin-left:auto;display:flex;gap:16px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.stats b{color:var(--ink);font-weight:500}
.hint{margin:0;color:var(--ink);opacity:.9;font-size:15px;line-height:1.4;min-height:1.4em;max-width:80ch;text-wrap:balance}
.stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.screen{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px rgba(156,195,255,.25),0 18px 50px rgba(0,0,0,.45)}
canvas{display:block;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:13.5px;color:var(--muted);align-items:center}
.legend .who{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.legend .who.s{color:var(--spark)} .legend .who.b{color:var(--bolt)}
kbd{font-family:var(--body);font-size:12px;font-weight:500;color:var(--ink);background:var(--panel);border:1px solid rgba(156,195,255,.3);border-bottom-width:2px;border-radius:4px;padding:1px 6px;margin:0 2px}
.tools{margin-left:auto;display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.ghost{background:transparent;color:var(--muted);border:1px solid rgba(156,195,255,.3);border-radius:6px;padding:4px 10px;font-size:13px}
.ghost:hover{color:var(--ink);border-color:var(--line)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.overlay[hidden]{display:none!important}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,18,38,.78);backdrop-filter:blur(2px);padding:16px;box-sizing:border-box;overflow:auto}
.card{max-width:640px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.card h2{font-family:var(--display);font-weight:900;font-size:clamp(26px,5vw,52px);line-height:1.05;margin:0;text-wrap:balance}
.card h2 .s{color:var(--spark)} .card h2 .b{color:var(--bolt)}
.card p{margin:0;color:var(--muted);line-height:1.45;text-wrap:balance}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--line);opacity:.8}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;text-align:left}
.hero{border:1px solid rgba(156,195,255,.25);border-radius:8px;padding:12px 14px;background:rgba(15,37,71,.7);min-width:0}
.hero h3{margin:0 0 6px;font-family:var(--display);font-size:15px}
.hero.s h3{color:var(--spark)} .hero.b h3{color:var(--bolt)}
.hero ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.primary{background:var(--brass);color:#1b1305;border:0;border-radius:8px;padding:11px 22px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.03em}
.primary:hover{filter:brightness(1.08)}
.secondary{background:transparent;color:var(--ink);border:1px solid rgba(156,195,255,.4);border-radius:8px;padding:10px 18px;font-weight:500}
.pick{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.pick input{width:72px;font:inherit;color:var(--ink);background:var(--panel);border:1px solid rgba(156,195,255,.35);border-radius:6px;padding:6px 8px}
.toast{position:absolute;top:10px;left:50%;transform:translate(-50%,-140%);transition:transform .35s ease;display:flex;gap:10px;align-items:center;background:rgba(8,22,44,.95);border:1px solid var(--brass);border-radius:10px;padding:8px 14px;max-width:calc(100% - 32px);box-sizing:border-box;pointer-events:none;z-index:5}
.toast.show{transform:translate(-50%,0)}
.toast .medal{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brass);color:#1b1305;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px}
.toast small{display:block;color:var(--brass);font-family:var(--display);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.toast b{font-weight:500}
.card.wide{max-width:860px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;width:100%;text-align:left;max-height:52vh;overflow:auto;padding-right:4px}
.ach{display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(156,195,255,.2);border-radius:8px;padding:8px 10px;background:rgba(15,37,71,.6);min-width:0}
.ach .medal{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:12px;background:rgba(156,195,255,.12);color:var(--muted)}
.ach.got{border-color:rgba(231,181,74,.6)} .ach.got .medal{background:var(--brass);color:#1b1305}
.ach h4{margin:0;font-size:13.5px;font-weight:500;color:var(--ink)} .ach p{margin:2px 0 0;font-size:12.5px;color:var(--muted);text-wrap:pretty}
.ach:not(.got) h4{color:var(--muted)}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;text-align:left}
.shop .hero{display:flex;flex-direction:column;gap:8px}
.shop canvas{width:120px;height:120px;align-self:center;background:#0f2547;border-radius:8px;border:1px solid rgba(156,195,255,.2)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid rgba(156,195,255,.3);background:rgba(8,22,44,.6);color:var(--ink);border-radius:6px;padding:5px 9px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.opt .sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.4)}
.opt.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.opt[aria-disabled]{opacity:.45;cursor:help}
.lab{font-family:var(--display);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media (max-width:640px){.shop{grid-template-columns:1fr}}
.pad{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;border:1px solid rgba(156,195,255,.4);background:var(--panel);color:var(--ink);font-size:11px;font-weight:700;margin:0 2px;vertical-align:middle}
.pad.round{border-radius:50%;padding:0}
.padsvg{display:inline-block;vertical-align:middle;margin:0 2px;flex:none}
.chip{display:inline-block;font-size:11px;font-weight:500;color:var(--brass);border:1px solid rgba(231,181,74,.5);border-radius:999px;padding:1px 8px;margin-right:6px}
.crow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:center;font-size:13px}
.crow.head{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.crow .opt{justify-content:center;min-height:30px}
.crow .muted{color:var(--muted);font-size:12px}
.padst{margin:0;font-size:12.5px;color:var(--muted)} .padst b{color:var(--brass);font-weight:500}
.srow{display:grid;grid-template-columns:1fr 1.3fr 44px;gap:10px;align-items:center;font-size:13.5px}
.srow input{width:100%;accent-color:var(--brass)}
.srow output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:12.5px}
.tog{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.tog input{margin-top:3px;accent-color:var(--brass);width:16px;height:16px;flex:none}
.tog small{display:block;color:var(--muted);font-size:12px}
.tog b{font-weight:500}
.medal.ic{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(156,195,255,.08);color:var(--muted);border:1px solid rgba(156,195,255,.18)}
.medal.ic svg{width:24px;height:24px}
.medal.ic.got{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 55%),var(--mc);color:#0b1830;border-color:transparent;box-shadow:0 0 0 2px rgba(255,255,255,.08),0 4px 14px -4px var(--mc)}
.medal.ic .lk{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;padding:2px;border-radius:50%;background:var(--night);color:var(--muted);box-sizing:border-box}
.ach .medal.ic{width:40px;height:40px}
.ach:not(.got) .medal.ic svg{opacity:.55}
.toast .medal.ic{width:36px;height:36px;border-radius:10px}
.go h2.goT{font-size:clamp(30px,6vw,64px);color:#ff6b6b;text-shadow:0 0 30px rgba(255,59,78,.55),0 4px 0 #3a0a12;animation:slam .55s cubic-bezier(.2,1.6,.4,1) both;letter-spacing:.02em}
.go h2.goT span{display:block;font-size:.5em;color:var(--ink);text-shadow:none;letter-spacing:.12em;margin-top:6px;animation:fadeup .6s .35s both}
@keyframes slam{0%{transform:scale(2.6);opacity:0;filter:blur(6px)}60%{opacity:1;filter:none}100%{transform:scale(1)}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tip{width:100%;max-width:560px;text-align:left;border:1px solid rgba(231,181,74,.45);border-left:3px solid var(--brass);background:rgba(231,181,74,.07);border-radius:8px;padding:10px 14px;box-sizing:border-box;animation:fadeup .6s .55s both}
.tip .tipH{font-family:var(--display);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.tip p{margin:4px 0 0;color:var(--ink);font-size:14px;line-height:1.45}
.goRow{display:flex;align-items:center;gap:14px;position:relative;flex-wrap:wrap;justify-content:center;animation:fadeup .6s .7s both}
.ring{width:62px;height:62px;transform:rotate(-90deg);flex:none}
.ring .rb{fill:none;stroke:rgba(156,195,255,.15);stroke-width:5}
.ring .rf{fill:none;stroke:#ff6b6b;stroke-width:5;stroke-linecap:round;stroke-dasharray:188.5}
.goNum{position:absolute;left:0;width:62px;text-align:center;font-family:var(--display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;pointer-events:none}
@media (max-width:640px){.goNum{position:static;width:auto}}
@media (prefers-reduced-motion:reduce){.go h2.goT,.go h2.goT span,.tip,.goRow{animation:none}}
body.kbnav .overlay button:focus,body.kbnav .overlay input:focus{outline:3px solid var(--brass);outline-offset:3px;box-shadow:0 0 0 7px rgba(231,181,74,.22)}
body.kbnav .overlay .tog:focus-within{outline:2px solid var(--brass);outline-offset:4px;border-radius:6px}
body.kbnav .overlay .tog input:focus{outline:none;box-shadow:none}
body.kbnav .overlay .primary:focus{transform:scale(1.04)}
.reward{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13.5px;color:var(--muted)}
.reward b{color:var(--brass);font-family:'Russo One',var(--display);font-weight:400}
.reward .tot b{color:var(--ink)}
.wallet{font-size:14px;color:var(--muted)} .wallet b{font-family:'Russo One',var(--display);font-weight:400;font-size:26px;color:var(--brass);margin-left:8px;vertical-align:-3px}
.ushop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.ucard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:1px solid rgba(156,195,255,.25);border-radius:12px;padding:16px 12px 12px;background:rgba(15,37,71,.75);min-width:0;transition:transform .2s}
.ucard .medal.ic{width:52px;height:52px;border-radius:14px} .ucard .medal.ic svg{width:30px;height:30px}
.ucard h4{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
.ucard p{margin:0;font-size:13px;line-height:1.4;color:var(--muted);min-height:3.6em}
.ucard .who{position:absolute;top:8px;right:10px;font-size:10.5px;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ucard .who.spark{color:var(--spark)} .ucard .who.bolt{color:var(--bolt)}
.pips{display:flex;gap:5px} .pips i{width:18px;height:5px;border-radius:3px;background:rgba(156,195,255,.2)} .pips i.on{background:var(--brass)}
.buy{width:100%;border:0;border-radius:8px;padding:9px 10px;background:var(--brass);color:#1b1305;font-family:var(--display);font-weight:700;font-size:12.5px}
.buy.no{background:rgba(156,195,255,.12);color:var(--muted)}
.owned{font-size:12.5px;color:#7fe08a;font-weight:500;padding:9px 0}
.ucard.done{opacity:.7} .ucard.bought{animation:boughtPop .5s ease}
@keyframes boughtPop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.owned-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
@media (max-width:700px){.ushop{grid-template-columns:1fr}}
.shopfull .ushop{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));max-height:50vh;overflow:auto;padding:4px}
.shopfull .ucard p{min-height:0}
.overlay.clear{background:transparent;backdrop-filter:none}
.titlescr{height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-block:6% 5%;box-sizing:border-box;text-align:center}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(40px,8.5vw,108px);line-height:1;letter-spacing:.02em;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .06em}
.lt{display:inline-block;animation:drop .7s cubic-bezier(.2,1.6,.4,1) both,float 3.2s ease-in-out infinite;animation-delay:inherit}
.lt.s{color:var(--spark);text-shadow:0 0 28px rgba(255,138,61,.55),0 6px 0 #6a2c08}
.lt.b{color:var(--bolt);text-shadow:0 0 28px rgba(98,199,193,.5),0 6px 0 #1c4e4b}
.lt.amp{color:var(--ink);font-size:.55em;align-self:center;margin:0 .3em;text-shadow:0 4px 0 #1a2a44}
@keyframes drop{0%{transform:translateY(-120%) scale(.6) rotate(-12deg);opacity:0}70%{opacity:1}100%{transform:none;opacity:1}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -6px}}
.tag{margin:10px 0 0;font-family:var(--display);font-size:clamp(11px,1.4vw,14px);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);animation:fadeup .8s 1.1s both}
.startwrap{display:flex;flex-direction:column;align-items:center;gap:8px;animation:fadeup .8s 1.3s both}
.primary.start{font-size:clamp(18px,2.4vw,26px);padding:16px 54px;border-radius:14px;letter-spacing:.14em;box-shadow:0 0 0 0 rgba(231,181,74,.6);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(231,181,74,.55)}70%{box-shadow:0 0 0 18px rgba(231,181,74,0)}100%{box-shadow:0 0 0 0 rgba(231,181,74,0)}}
.press{margin:0;font-size:13px;color:var(--muted)}
.card.menu{max-width:520px;gap:12px}
.mlogo{font-size:clamp(28px,4vw,40px)!important}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.mlist button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:46px;font-size:14.5px}
.mlist button small{font-size:11.5px;opacity:.75;font-weight:400;font-family:var(--body);letter-spacing:0}
.mlist .mbig{grid-column:1/-1;min-height:62px;font-size:18px}
.mfoot{font-size:12px!important}
.lvgrid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.helpbody{width:100%;max-height:46vh;overflow:auto;text-align:left;padding-right:4px}
.htable{width:100%;border-collapse:collapse;font-size:13.5px}
.htable th,.htable td{padding:7px 8px;border-bottom:1px solid rgba(156,195,255,.14);text-align:left;vertical-align:middle}
.htable thead th{font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.htable thead th.s{color:var(--spark)} .htable thead th.b{color:var(--bolt)}
.htable tbody th{font-weight:500;color:var(--ink);white-space:nowrap}
.hlist{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.45;color:var(--muted)}
.hlist b{color:var(--ink);font-weight:500}
.hlist.ctl .hero h3 .padst{display:inline;font-family:var(--body);font-size:12px;letter-spacing:0}
.padstyle{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.paddiag{display:flex;flex-direction:column;align-items:center;gap:4px;margin:2px 0 6px}
.paddiag svg{width:100%;max-width:300px;height:auto}
.plegend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.padopt{gap:4px}
.palette{display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(156,195,255,.18);padding-top:8px;margin-top:4px}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pgrid .opt{justify-content:center;padding:5px 2px;min-height:34px}
.modes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.primary.start.mode,.secondary.start.mode{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 34px;min-width:220px;font-family:var(--display);font-weight:900;letter-spacing:.1em}

.start.mode small{font-family:var(--body);font-weight:500;font-size:12.5px;letter-spacing:0;opacity:.8}
.hsub{margin:16px 0 0;font-size:14px;color:var(--brass);font-weight:500}
.pickhero{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--ink);font:inherit;text-align:left}

.pickhero:hover,.pickhero:focus-visible{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.big{font-size:14px;gap:8px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.hitem{display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(156,195,255,.18);border-radius:10px;padding:10px;background:rgba(15,37,71,.55)}
.hitem h4{margin:0;font-size:14px;color:var(--ink);font-weight:500} .hitem p{margin:2px 0 0;font-size:12.5px;line-height:1.4;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
