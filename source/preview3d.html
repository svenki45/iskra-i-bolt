<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Искра 3D — просмотр</title>
<style>
html,body{margin:0;height:100%;background:#0d1220;color:#e8eefc;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;left:14px;top:14px;display:flex;flex-direction:column;gap:8px;max-width:260px}
#ui button{background:#1c2540;color:#e8eefc;border:1px solid #3a4a7a;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;text-align:left}
#ui button.on{background:#ff8a3d;color:#2a1308;border-color:#ffb27a;font-weight:700}
#ui label{font-size:13px;opacity:.85;display:flex;gap:8px;align-items:center}
#msg{position:fixed;left:14px;bottom:14px;font-size:13px;opacity:.7}
</style></head><body>
<div id="ui">
  <button data-a="" class="on">Стойка</button>
  <button data-a="Walking">Ходьба</button>
  <button data-a="Running">Бег</button>
  <label><input type="checkbox" id="rot" checked> крутить вокруг</label>
  <label><input type="checkbox" id="fl" checked> колыхание пламени</label>
  <label><input type="checkbox" id="side"> вид сбоку (как в игре)</label>
</div>
<div id="msg">Загрузка модели…</div>
<script>/*THREE*/</script>
<script>/*HERO3D*/</script>
<script>
const R=new THREE.WebGLRenderer({antialias:true}); R.setPixelRatio(Math.min(2,devicePixelRatio||1)); R.outputEncoding=THREE.sRGBEncoding; document.body.prepend(R.domElement);
const S=new THREE.Scene(); S.background=new THREE.Color(0x151c30);
S.add(new THREE.HemisphereLight(0xbfd0ff,0x30283a,1.1)); const dl=new THREE.DirectionalLight(0xffffff,1.3); dl.position.set(2,3,4); S.add(dl);
const fire=new THREE.PointLight(0xff9a3d,1.2,6,1.6); S.add(fire);
const floor=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.MeshStandardMaterial({color:0x232b45,roughness:.9})); floor.rotation.x=-Math.PI/2; S.add(floor);
const cam=new THREE.PerspectiveCamera(35,1,.1,50);
function size(){ R.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); } addEventListener('resize',size); size();
let act='', t0=performance.now(), model=null;
document.querySelectorAll('#ui button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#ui button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); act=b.dataset.a; });
HERO3D.load().then(ok=>{ const m=document.getElementById('msg'); if(!ok){ m.textContent='Не удалось загрузить модель'; return; } model=HERO3D.spark; S.add(model.group); m.textContent=''; });
(function loop(){ requestAnimationFrame(loop); const t=(performance.now()-t0)/1000;
  if(model){ model.play(act||null,t); if(document.getElementById('fl').checked) model.flame(t,1); else model.flame(t,0); fire.position.set(0,1.6,.4);
    const side=document.getElementById('side').checked, ang=side?Math.PI/2:(document.getElementById('rot').checked?t*.5:0.4), r=4.2;
    cam.position.set(Math.sin(ang)*r,1.1,Math.cos(ang)*r); cam.lookAt(0,.85,0); }
  else { cam.position.set(0,1.1,4.2); cam.lookAt(0,.85,0); }
  R.render(S,cam); })();
</script></body></html>
