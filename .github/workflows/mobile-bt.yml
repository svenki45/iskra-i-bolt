name: Mobile (Искра и Болт, IPA)
on:
  workflow_dispatch:
  push:
    paths: ['bt/**', '.github/workflows/mobile-bt.yml']
permissions:
  contents: write
defaults:
  run:
    working-directory: mobile-app
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Подставить сборку игры (та же, что на iPhone)
        working-directory: .
        run: |
          cp bt/index.html mobile-app/www/index.html
          cp bt/intro.mp4 mobile-app/www/intro.mp4
          python3 - <<'PY'
          p='mobile-app/www/index.html'; t=open(p,encoding='utf-8').read()
          t=t.replace('</head>','<style>#a2hs{display:none!important}</style></head>',1); open(p,'w',encoding='utf-8').write(t)
          PY
          grep -c 'a2hs{display:none' mobile-app/www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b1830' --splashBackgroundColor '#0b1830' || echo "icons skipped"
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk iskra-i-bolt.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: mobile-app/iskra-i-bolt.apk }
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Подставить сборку игры
        working-directory: .
        run: |
          cp bt/index.html mobile-app/www/index.html
          cp bt/intro.mp4 mobile-app/www/intro.mp4
          python3 - <<'PY'
          p='mobile-app/www/index.html'; t=open(p,encoding='utf-8').read()
          t=t.replace('</head>','<style>#a2hs{display:none!important}</style></head>',1); open(p,'w',encoding='utf-8').write(t)
          c='mobile-app/capacitor.config.json'; t=open(c,encoding='utf-8').read()
          t=t.replace('com.iskraibolt.game','com.iskraibolt.trials').replace('"appName": "Искра и Болт"','"appName": "Искра и Болт"'); open(c,'w',encoding='utf-8').write(t)
          PY
          grep -c 'a2hs{display:none' mobile-app/www/index.html
      - run: npm install
      - run: npx cap add ios
      - run: npx @capacitor/assets generate --ios --iconBackgroundColor '#0b1830' --splashBackgroundColor '#0b1830' || echo "icons skipped"
      - name: Landscape fullscreen
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" $P
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" $P
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" $P || /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden true" $P
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $P || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" $P
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" $P || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" $P
      - run: npx cap sync ios
      - run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          mkdir -p Payload && cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry iskra-i-bolt.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ipa, path: mobile-app/iskra-i-bolt.ipa }
  release:
    needs: [ios, android]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/download-artifact@v4
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete mobile-bt --repo ${{ github.repository }} --yes --cleanup-tag || true
          gh release create mobile-bt --repo ${{ github.repository }} --title "Искра и Болт — iPhone и Android" --notes "IPA (iPhone) и APK (Android) — одна и та же игра" ipa/iskra-i-bolt.ipa apk/iskra-i-bolt.apk
