name: iOS IPA
on:
  push:
    paths: ['android-app/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Capacitor iOS project
        working-directory: android-app
        run: |
          set -x
          npm install
          npx cap add ios
          npx cap sync ios
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeRight" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft" $P
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeRight" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeLeft" $P
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" $P || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" $P
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" $P || /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden true" $P
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $P || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" $P
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.11" $P || true
          ICON=$(ls ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png | head -1)
          cp res/icon-1024.png "$ICON"
      - name: Build unsigned IPA
        working-directory: android-app/ios/App
        run: |
          set -x
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -30
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../../iskra-i-bolt.ipa Payload
          ls -la ../../../iskra-i-bolt.ipa
      - name: Publish release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release delete ipa -y --cleanup-tag || true
          gh release create ipa iskra-i-bolt.ipa --title "Искра и Болт — IPA для iOS (Sideloadly)" --notes "Неподписанная сборка v1.11. Установка через Sideloadly с вашим Apple ID."
