name: Android APK
on:
  push:
    paths: ['android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Capacitor project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cp res/MainActivity.java android/app/src/main/java/com/edwarddergachev/iskraibolt/MainActivity.java
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do n=${d%%:*}; s=${d##*:};
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              [ -f android/app/src/main/res/mipmap-$n/$f.png ] && convert res/icon.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png; done; done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../iskra-i-bolt.apk
      - name: Publish release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release delete apk -y --cleanup-tag || true
          gh release create apk iskra-i-bolt.apk --title "Искра и Болт — APK для Android" --notes "Тестовая сборка v0.99 (debug). Установка: скачать iskra-i-bolt.apk и открыть на телефоне или перетащить в эмулятор."
